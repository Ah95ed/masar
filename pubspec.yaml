name: masar
description: "A new Flutter project."

publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.13.2


dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  flutter_secure_storage: ^11.2.0
  provider: ^6.1.1
  intl: ^0.20.3
  http_parser: ^4.1.2
  file_picker: ^13.1.0
  flutter_localizations:
    sdk: flutter
  google_fonts: ^9.0.0
  shared_preferences: ^2.5.6
  crypto: ^3.0.7
  signature: ^6.4.0
  fl_chart: ^1.2.0
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  cached_network_image: ^4.0.4
  flutter_local_notifications: ^22.3.1
  flutter_background_service: ^5.1.0
  local_notifier: ^0.1.6
  excel: ^4.0.6
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
